# OVH-001: Self-supporting slope. Catalog data, CC BY 4.0. Generated from the master table, then edited by hand.
schema: fdmgen/rule@0.1
id: OVH-001
name: Self-supporting slope
protects: Droop, curl, support scars
convention:
  angle: slope_from_horizontal
levels:
- V
- M
- T
enforcement:
- hard_filter
- post_check
- repair
enforcement_text: V hard_filter at 50° (PLAN D5 grid, 5-point cross); M/T post_check at 50°; repair + re-check
defaults:
  petg: α ≥ 50° at V (D5 grid), M and T
  asa: same
evidence: S (threshold), H (quality)
parameters:
  alpha_min_deg:
    value: 50
    unit: deg
    tag: S
    status: PROVISIONAL
    note: 'M/T threshold: Orca supported the 45 deg test wedge and left 55 deg alone; 5 deg margin (slice only,
      not a print test)'
  alpha_grid_deg:
    value: 50
    unit: deg
    tag: derived
    status: PROVISIONAL
    note: 'V level: 5-point cross stencil on dx = dz tan 40 deg cells (PLAN D5) accepts >= 50.0 deg at every azimuth'
  alpha_tol_deg:
    value: 0.05
    unit: deg
    tag: derived
    status: PROVISIONAL
    note: mesh precision; faces designed at 50 deg measured 49.96..49.9999 deg on the real spool bracket STL
  bridge_alpha_max_deg:
    value: 0.5
    unit: deg
    tag: logic
    status: PROVISIONAL
    note: horizontal ceilings off the bed print as bridges and are checked by BRG-001 (span, anchors), not OVH-001
  min_island_area_mm2:
    value: 0.3
    unit: mm2
    tag: S
    status: PROVISIONAL
    note: islands smaller than this are reported, not failed
checkers:
  V: fdmgen.catalog.checks.ovh.check_voxel
  M: fdmgen.catalog.checks.ovh.check_mesh
slicer_keys:
- support_threshold_angle
- enable_support
- support_type
note: 'PLAN D5 supersedes the round-1 ''45 deg at V'': the non-cubic design grid enforces 50 deg at V too. M and
  T stay authoritative.'
calibration_coupon: 'overhang ladder, alpha 35..60 deg by 5 (issue #12)'
sources:
- tag: S
  ref: research/final/frodo.md section 3.1 (master table)
- tag: S
  ref: research/final/frodo.md section 3.2 (rule cards)
